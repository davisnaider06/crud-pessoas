name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Lint, formatação e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Análise estática (ESLint)
        run: npm run lint
      - name: Formatação (Prettier)
        run: npm run format:check
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de integração
        run: npm run test:integration

  imagem:
    name: Build da imagem Docker
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t crud-pessoas:${{ github.sha }} .
      - name: Smoke test do container
        run: |
          docker run -d -p 3000:3000 --name app crud-pessoas:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:3000/pessoas
